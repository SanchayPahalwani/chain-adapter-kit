# Services are reached only from the host through published ports, so no project network is needed.
services:
  # Credentials kit/kit are test-only: a throwaway database, published on 127.0.0.1 only.
  postgres:
    image: postgres:17-alpine
    network_mode: bridge
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kit -h 127.0.0.1']
      interval: 2s
      timeout: 3s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    network_mode: bridge
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--no-mining']
    ports:
      - '127.0.0.1:58545:8545'
    healthcheck:
      test: ['CMD-SHELL', 'cast chain-id --rpc-url http://127.0.0.1:8545']
      interval: 2s
      timeout: 3s
      retries: 30

  # Credentials kit/kit are test-only: regtest, published on 127.0.0.1 only. No volume, so
  # `make down` resets the chain.
  bitcoind:
    build: docker/bitcoind
    image: chain-adapter-kit-bitcoind:32.1
    pull_policy: build # a local image: never look for it in a registry
    network_mode: bridge
    command: >-
      -regtest -server -txindex=1 -fallbackfee=0.0002
      -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0 -rpcuser=kit -rpcpassword=kit
      -connect=0 -listen=0 -listenonion=0 -printtoconsole
    ports:
      - '127.0.0.1:58443:18443'
    healthcheck:
      test:
        ['CMD', 'bitcoin-cli', '-regtest', '-rpcuser=kit', '-rpcpassword=kit', 'getblockchaininfo']
      interval: 2s
      timeout: 3s
      retries: 30
