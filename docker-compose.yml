services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kit']
      interval: 2s
      timeout: 3s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.9.0
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--no-mining']
    ports:
      - '127.0.0.1:58545:8545'
    healthcheck:
      test: ['CMD-SHELL', 'cast chain-id --rpc-url http://127.0.0.1:8545']
      interval: 2s
      timeout: 3s
      retries: 30
