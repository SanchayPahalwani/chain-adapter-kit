name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: docker compose up -d --wait
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
